[package]
name = "thermia2mqtt"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Simonas Kazlauskas <thermia@kazlauskas.me>"]

[dependencies]
clap = { version = "4.6.7", features = ["cargo", "derive", "error-context"] }
comfy-table = "8.0.1"
csv-core = "0.1.13"
futures = "0.3.34"
homie5 = "0.12.0"
humantime = "2.4.0"
jiff = "0.2.38"
rumqttc = { version = "0.25.1", features = ["url"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "net", "rt", "sync", "time"] }
tokio-modbus = { version = "0.17.0", default-features = false, features = ["tcp"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[lints.clippy]
style = { level = "allow" }
correctness = { level = "deny" }
suspicious = { level = "deny" }
perf = { level = "deny" }
